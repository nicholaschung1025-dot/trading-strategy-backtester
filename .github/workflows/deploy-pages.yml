name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # Everything except the server-side bits is static.
          ignore: |
            .github
            server.py
            Procfile
            render.yaml
            requirements.txt
            scripts
            tests
            docs
            README.md
            LICENSE
      - id: deployment
        uses: actions/deploy-pages@v4
