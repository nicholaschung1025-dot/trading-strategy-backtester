name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # Only the static app is published; the server-side bits stay in the repo.
          ignore: |
            .github
            .vscode
            server.py
            Procfile
            render.yaml
            scripts
            tests
            docs
            legacy
            deploy
            README.md
            LICENSE
            .gitattributes
            .gitignore
            package.json
            Dockerfile
            docker-compose.yml
            start.bat
            start.sh
      - id: deployment
        uses: actions/deploy-pages@v4
