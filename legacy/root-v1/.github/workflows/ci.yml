name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Python syntax
        run: python -m py_compile server.py legacy/streamlit/*.py
